<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; worker-src 'self' blob:; connect-src 'self';">
    <title>医療費集計フォーム (Report)</title>

<style>
body {
  font-family: system-ui, -apple-system, sans-serif;
}
</style>
    
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
        
        const fonts = ["sans-serif"];
        const fontFamily = fonts.join(', ');
        
        mermaid.initialize({
            startOnLoad: false,
            theme: window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default',
            fontFamily: fontFamily
        });
        
        await mermaid.run({
            querySelector: '.mermaid'
        });
    </script>
</head>
<body>
    <main>
        
        <div class="weba-report-container">
            <h1>医療費集計フォーム (集計)</h1>
            <div id="aggregator-root">Loading...</div>
        </div>
        <script id="weba-structure" type="application/json">{"@context":"https://schema.org","@type":"CreativeWork","fields":[{"key":"total_paid","label":"支払った医療費の金額計","type":"calc"},{"key":"total_comp","label":"補填される金額計","type":"calc"}],"tables":{"details":[{"key":"no","label":"no","type":"autonum"},{"key":"patient","label":"全角10文字以内","type":"text"},{"key":"place","label":"全角20文字以内","type":"text"},{"key":"cat_med","label":"cat_med","type":"checkbox"},{"key":"cat_drug","label":"cat_drug","type":"checkbox"},{"key":"cat_care","label":"cat_care","type":"checkbox"},{"key":"cat_other","label":"cat_other","type":"checkbox"},{"key":"amount","label":"半角数字","type":"number"},{"key":"comp","label":"半角数字","type":"number"},{"key":"date","label":"date","type":"date"}]},"masterData":{},"name":"医療費集計フォーム"}</script>
        <script src="./assets/form-bundle.js"></script>
        <script>
            // Initialize Aggregator
            document.addEventListener('DOMContentLoaded', () => {
                if (window.WebA && window.WebA.initAggregator) {
                    window.WebA.initAggregator();
                } else {
                    console.warn("WebA Aggregator not found");
                }
            });
        </script>
    
    </main>
    <script>
        (() => {
            const lang = (navigator.language || '').toLowerCase();
            const isJa = lang.startsWith('ja');
            document.querySelectorAll('[data-i18n-ja]').forEach((el) => {
                const ja = el.getAttribute('data-i18n-ja') || '';
                const en = el.getAttribute('data-i18n-en') || ja;
                el.textContent = isJa ? ja : en;
            });
        })();
    </script>
</body>
</html>
